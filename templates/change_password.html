{% extends 'base.html' %}

{% block content %}
<style>
    .auth-card { border: none; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,102,179,0.08); }
    .auth-header { color: var(--primary-dark); font-weight: 800; letter-spacing: -0.5px; }
    .btn-auth { background-color: var(--primary); color: white; border-radius: 8px; font-weight: 600; padding: 12px; transition: all 0.3s; border: none; }
    .btn-auth:hover { background-color: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,102,179,0.2); color: white; }
    .form-control { border-radius: 8px; padding: 10px 15px; border-color: #e2e8f0; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 0.25rem var(--primary-light); }
    .input-group-text { border-radius: 8px 0 0 8px; border-color: #e2e8f0; background: var(--bg-light); color: var(--primary); }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 70px; height: 70px; background: #e8fff0; color: #166534;">
                            <i class="fas fa-shield-alt fs-2"></i>
                        </div>
                        <h3 class="auth-header mb-1">Đổi Mật Khẩu</h3>
                        <p class="text-muted small">Tạo mật khẩu mạnh để bảo vệ tài khoản</p>
                    </div>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} rounded-3 shadow-sm text-center small fw-medium">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="/change-password" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark small">Mật khẩu hiện tại</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-unlock"></i></span>
                                <input type="password" name="old_password" class="form-control border-start-0 ps-0" placeholder="Nhập mật khẩu đang dùng" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark small">Mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" name="new_password" class="form-control border-start-0 ps-0" placeholder="Tạo mật khẩu mới" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark small">Xác nhận mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-check-double"></i></span>
                                <input type="password" name="confirm_password" class="form-control border-start-0 ps-0" placeholder="Nhập lại mật khẩu mới" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-auth w-100 mt-2">
                            <i class="fas fa-sync-alt me-2"></i>CẬP NHẬT MẬT KHẨU
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
